name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3333
  HOST: 127.0.0.1
  LOG_LEVEL: silent
  SESSION_DRIVER: memory
  APP_KEY: ci-only-app-key-with-at-least-32-characters
  DB_URL: postgres://postgres:postgres@127.0.0.1:5432/antirecurso_test
  AUTH_ISSUER_URL: https://auth.example.test
  AUTH_ALLOWED_AUDIENCES: antirecurso-ci

jobs:
  quality:
    name: Lint, typecheck, test, migrate & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antirecurso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d antirecurso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile for migration
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Apply automatic lint fixes
        run: npm run lint -- --fix

      - name: Persist generated migration files
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json app/exceptions/handler.ts app/middleware/container_bindings_middleware.ts app/services/exams/exam_generation_service.ts app/services/exams/exam_verification_service.ts
            git commit -m "fix(deps): regenerate lockfile and apply lint fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: node ace test --no-assets

      - name: Apply migrations to an isolated database
        run: node ace migration:run --force

      - name: Production build
        run: npm run build

      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Build image
        run: docker build -t antirecurso-api-check .

      - name: Verify non-root runtime
        run: test "$(docker inspect --format '{{.Config.User}}' antirecurso-api-check)" = "node"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/secret-scan@master
