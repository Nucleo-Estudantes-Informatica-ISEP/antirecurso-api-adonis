name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3333
  HOST: 127.0.0.1
  LOG_LEVEL: silent
  SESSION_DRIVER: memory
  APP_KEY: ci-only-app-key-with-at-least-32-characters
  DB_URL: postgres://postgres:postgres@127.0.0.1:5432/antirecurso_test
  AUTH_ISSUER_URL: https://auth.example.test
  AUTH_ALLOWED_AUDIENCES: antirecurso-ci

jobs:
  quality:
    name: Lint, typecheck, test, migrate & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antirecurso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d antirecurso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile for migration validation
        run: npm install --package-lock-only

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: adonis-v7-package-lock
          path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: node ace test --no-assets

      - name: Apply migrations to an isolated database
        run: node ace migration:run --force

      - name: Production build
        run: npm run build

      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download regenerated lockfile
        uses: actions/download-artifact@v4
        with:
          name: adonis-v7-package-lock
          path: .

      - name: Build image
        run: docker build -t antirecurso-api-check .

      - name: Verify non-root runtime
        run: test "$(docker inspect --format '{{.Config.User}}' antirecurso-api-check)" = "node"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/secret-scan@master
