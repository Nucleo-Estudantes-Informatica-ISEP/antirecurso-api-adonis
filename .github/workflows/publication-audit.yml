name: Publication audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/secret-scan@master
        with:
          full-history: "true"
