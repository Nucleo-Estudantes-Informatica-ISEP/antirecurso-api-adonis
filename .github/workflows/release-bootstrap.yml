name: Release Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-bootstrap.yml
  workflow_dispatch: {}

jobs:
  bootstrap-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOOTSTRAP_SHA: 3ca2d735de7b908fdb04eecaab181f8c69320ddb
    steps:
      - name: Create release labels
        run: |
          gh label create release:major --color B60205 --description "Next merge to main creates a new major release" --force
          gh label create release:minor --color 0E8A16 --description "Next merge to main creates a new minor release" --force
          gh label create release:patch --color 1D76DB --description "Next merge to main creates a new patch release" --force

      - name: Publish Antirecurso API v2 baseline
        run: |
          set -euo pipefail

          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists; bootstrap is complete."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          # Antirecurso API v2

          Antirecurso API v2 establishes the formal release baseline for the AdonisJS backend that powers the Antirecurso platform.

          ## Highlights

          - AdonisJS 6 / TypeScript REST API backed by PostgreSQL and Lucid ORM.
          - Subjects, questions, exams, notes, comments, scores, reports, users and admin-managed events.
          - ZITADEL/AuthNEI bearer-token validation with issuer, audience, signature, expiry and role enforcement.
          - Student/admin authorization boundaries based on AuthNEI project roles rather than legacy database flags.
          - Supabase-backed private note storage and signed upload/download workflows.
          - Database migrations, Japa tests, Docker deployment and health/liveness support.

          This release is pinned to the main snapshot at ${BOOTSTRAP_SHA}. Open stabilization work is intentionally excluded and will receive its own automated version once merged.

          Future PRs into main select exactly one semantic-version bump using release:major, release:minor or release:patch.
          EOF

          gh release create v2.0.0 \
            --target "$BOOTSTRAP_SHA" \
            --title "Antirecurso API v2" \
            --notes-file /tmp/release-notes.md \
            --latest
