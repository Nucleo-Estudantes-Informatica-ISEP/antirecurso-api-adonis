services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:-${SERVICE_BASE64_32_APPKEY:-development-only-antirecurso-api-app-key}}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}

      DB_URL: ${DB_URL:?Configure DB_URL in Coolify}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}

      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-https://auth.nei-isep.org}
      AUTH_PROJECT_ID: ${AUTH_PROJECT_ID:?Configure AUTH_PROJECT_ID in Coolify}
      AUTH_GLOBAL_PROJECT_ID: ${AUTH_GLOBAL_PROJECT_ID:?Configure AUTH_GLOBAL_PROJECT_ID in Coolify}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:-${AUTH_PROJECT_ID}}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_GLOBAL_PROJECT_ID}:roles}
      AUTH_DEBUG: ${AUTH_DEBUG:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://antirecurso.nei-isep.org}

      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL in Coolify}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Configure SUPABASE_SERVICE_ROLE_KEY in Coolify}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-notes}

      LIMITER_STORE: ${LIMITER_STORE:-database}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    expose:
      - "3333"
    restart: unless-stopped
